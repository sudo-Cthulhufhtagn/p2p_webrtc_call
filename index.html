<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carrier — direct browser calls</title>
<meta name="description" content="Peer-to-peer video calls for 2–3 people. No account, no server holding your stream.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">

<style>
  :root {
    --ink:      #0A0C10;
    --panel:    #141A22;
    --edge:     #263040;
    --text:     #E9ECF1;
    --muted:    #8894A6;
    --signal:   #F2A65A;
    --live:     #4ADE80;
    --display:  'Bricolage Grotesque', system-ui, sans-serif;
    --mono:     'JetBrains Mono', ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box }
  body {
    margin: 0; min-height: 100dvh; background: var(--ink); color: var(--text);
    font-family: var(--mono); font-size: 15px;
    background-image: radial-gradient(120% 80% at 50% -20%, #1A2230 0%, var(--ink) 60%);
  }
  h1, h2 { font-family: var(--display); font-weight: 800; letter-spacing: -.02em; margin: 0 }
  .eyebrow {
    font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted);
  }

  /* ---- stages ------------------------------------------------------- */
  .stage {
    min-height: 100dvh; display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 28px; padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto; text-align: center;
  }
  [hidden] { display: none !important }

  .brand h1 { font-size: clamp(44px, 13vw, 76px); line-height: .92 }
  .brand h1 em {
    font-style: normal; color: var(--signal);
    /* the dot on the "i" of the wordmark doubles as the carrier lamp */
  }
  .brand p { color: var(--muted); margin: 14px 0 0; font-size: 14px; line-height: 1.6 }

  /* ---- carrier line: the signature ---------------------------------- */
  .carrier { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 320px }
  .carrier i {
    width: 9px; height: 9px; border-radius: 50%; flex: none;
    background: var(--edge); box-shadow: 0 0 0 4px #26304055;
  }
  .carrier span {
    flex: 1; height: 2px;
    background: repeating-linear-gradient(90deg, var(--edge) 0 7px, transparent 7px 14px);
    background-size: 14px 2px; animation: drift 1.4s linear infinite;
  }
  @keyframes drift { to { background-position: 14px 0 } }
  .carrier.up i { background: var(--live) }
  .carrier.up span { background: var(--live); animation: none; opacity: .55 }
  .carrier.up i:first-child { background: var(--signal) }

  /* ---- controls ------------------------------------------------------ */
  .choices { display: grid; gap: 12px; width: 100%; }
  button, .btn {
    font: 600 14px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase;
    color: var(--text); background: var(--panel); border: 1px solid var(--edge);
    padding: 18px 20px; border-radius: 12px; cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: 14px; transition: border-color .15s, background .15s;
  }
  button:hover { border-color: var(--signal) }
  button:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px }
  button .sub {
    display: block; margin-top: 6px; font: 400 12px/1.4 var(--mono);
    letter-spacing: 0; text-transform: none; color: var(--muted);
  }
  button .num { color: var(--signal); font-size: 12px; align-self: flex-start }
  .primary {
    background: var(--signal); color: #10131A; border-color: var(--signal);
    justify-content: center; text-align: center;
  }
  .primary:hover { background: #FFBE72 }
  .ghost { background: none; justify-content: center; padding: 14px }
  .link { background: none; border: 0; color: var(--muted); text-transform: none; letter-spacing: 0;
          font-weight: 400; padding: 8px; justify-content: center }
  .link:hover { color: var(--text) }

  /* ---- setup --------------------------------------------------------- */
  .preview {
    width: 100%; aspect-ratio: 4/3; background: #0D1117; border: 1px solid var(--edge);
    border-radius: 16px; overflow: hidden; position: relative;
  }
  .preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1) }
  .preview .off-note {
    position: absolute; inset: 0; display: grid; place-content: center;
    color: var(--muted); font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
  }
  .toggles { display: flex; gap: 10px; width: 100%; }
  .toggles button { flex: 1; justify-content: center; padding: 14px 8px; font-size: 12px }
  .toggles button[aria-pressed="false"] { color: var(--muted); border-style: dashed }
  .toggles button[aria-pressed="false"] svg { opacity: .45 }

  input {
    font: 600 28px/1 var(--mono); letter-spacing: .34em; text-align: center; text-transform: uppercase;
    width: 100%; padding: 20px 12px 20px 22px; color: var(--text);
    background: var(--panel); border: 1px solid var(--edge); border-radius: 12px;
  }
  input:focus { outline: none; border-color: var(--signal) }
  input::placeholder { color: #3A4557; letter-spacing: .34em }

  /* ---- code readout -------------------------------------------------- */
  .readout { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap }
  .readout b {
    font: 600 clamp(20px, 6.2vw, 30px)/1 var(--mono); color: var(--signal);
    background: var(--panel); border: 1px solid var(--edge); border-radius: 8px;
    padding: 12px 0; width: clamp(34px, 9.2vw, 44px); text-align: center;
  }
  #qr { border-radius: 12px; display: block; margin: 0 auto; width: 172px; height: 172px }
  .copy-row { display: flex; gap: 8px; width: 100% }
  .copy-row button { flex: 1; justify-content: center; font-size: 12px; padding: 14px }

  /* ---- call ---------------------------------------------------------- */
  #call { padding: 0; display: flex; flex-direction: column; height: 100dvh }
  #grid {
    flex: 1; min-height: 0; display: grid; gap: 8px; padding: 8px;
    grid-template-columns: 1fr; grid-auto-rows: 1fr;
  }
  @media (min-width: 720px) {
    #grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); align-items: stretch }
  }
  .tile {
    position: relative; background: #0D1117; border: 1px solid var(--edge);
    border-radius: 14px; overflow: hidden; min-height: 0;
  }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block }
  .tile.me video { transform: scaleX(-1) }
  .tile figcaption {
    position: absolute; left: 10px; bottom: 10px; font-size: 11px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--text); background: #0A0C10CC;
    padding: 6px 10px; border-radius: 999px; backdrop-filter: blur(6px);
  }
  #bar {
    display: flex; gap: 10px; justify-content: center; align-items: center;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--edge); background: #0A0C10;
  }
  #bar button {
    width: 54px; height: 54px; padding: 0; border-radius: 50%; justify-content: center;
  }
  #bar button[aria-pressed="false"] { color: var(--muted); background: none; border-style: dashed }
  #bar .leave { background: #3A1620; border-color: #6B2436; color: #FF8FA3; width: auto; padding: 0 22px }
  #bar .leave:hover { background: #4D1B2A; border-color: #FF8FA3 }
  #room {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: center;
    padding: 12px; pointer-events: none;
  }
  #room button {
    pointer-events: auto; padding: 10px 16px; font-size: 13px; letter-spacing: .22em;
    background: #0A0C10CC; backdrop-filter: blur(6px); color: var(--signal);
  }
  svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8;
        stroke-linecap: round; stroke-linejoin: round; flex: none }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>

<!-- ═══ 1. lobby ═══ -->
<main class="stage" id="lobby">
  <div class="brand">
    <p class="eyebrow">Peer to peer · no account</p>
    <h1>Carr<em>i</em>er</h1>
    <p>A direct line between two or three browsers.<br>Your video never touches a server.</p>
  </div>
  <div class="carrier"><i></i><span></span><i></i></div>
  <div class="choices">
    <button id="go-host"><span class="num">01</span><span>Open a room
      <span class="sub">Get a code, a link and a QR to hand out.</span></span></button>
    <button id="go-join"><span class="num">02</span><span>Join a room
      <span class="sub">You need the 8-character code from the host.</span></span></button>
  </div>
</main>

<!-- ═══ 2. setup ═══ -->
<main class="stage" id="setup" hidden>
  <div>
    <p class="eyebrow">Step two</p>
    <h2 id="setup-title" style="font-size:30px;margin-top:8px">Check yourself</h2>
  </div>
  <div class="preview"><p class="off-note" id="off-note" hidden>Camera off</p><video id="pv" autoplay playsinline muted></video></div>
  <div class="toggles">
    <button id="t-mic" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Mic</button>
    <button id="t-cam" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="3"/><path d="m15 11 6-4v10l-6-4"/></svg>Camera</button>
  </div>
  <input id="code-in" placeholder="········" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" hidden>
  <button class="primary" id="enter" style="width:100%">Open the room</button>
  <button class="link" id="back">← back</button>
</main>

<!-- ═══ 3. share (host only) ═══ -->
<main class="stage" id="share" hidden>
  <div>
    <p class="eyebrow">Room is live · waiting</p>
    <h2 style="font-size:26px;margin-top:8px">Hand this to your people</h2>
  </div>
  <div class="readout" id="readout"></div>
  <canvas id="qr"></canvas>
  <div class="carrier" id="carrier2"><i></i><span></span><i></i></div>
  <div class="copy-row">
    <button id="copy">Copy link</button>
    <button class="primary" id="to-call" style="flex:1">Enter room</button>
  </div>
</main>

<!-- ═══ 4. call ═══ -->
<div id="call" hidden>
  <div id="grid"></div>
  <div id="room"><button id="show-code" hidden></button></div>
  <div id="bar">
    <button id="c-mic" aria-pressed="true" title="Microphone" aria-label="Microphone"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="c-cam" aria-pressed="true" title="Camera" aria-label="Camera"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="3"/><path d="m15 11 6-4v10l-6-4"/></svg></button>
    <button id="c-spk" aria-pressed="true" title="Incoming sound" aria-label="Incoming sound"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/></svg></button>
    <button class="leave" id="leave">Leave</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const PREFIX = 'carrier-';        // ponytail: public PeerJS server is one shared namespace; prefix avoids id clashes
const peers = new Set();          // remote peer ids we already have a call with
let peer, stream, mode, code, url;

const show = id => ['lobby', 'setup', 'share', 'call'].forEach(
  s => $('#' + s).hidden = s !== id);

const randCode = () =>            // no 0/O/1/I — these get read aloud and typed on phones
  [...crypto.getRandomValues(new Uint8Array(8))]
    .map(n => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[n % 32]).join('');

/* ---- media ---------------------------------------------------------- */
// ponytail: always grab both tracks, then just disable what you didn't want.
// Renegotiating a track mid-call is a lot of code; `enabled = false` sends black/silence.
const track = kind => stream?.getTracks().find(t => t.kind === kind);

function setTrack(kind, on) {
  const t = track(kind); if (!t) return;
  t.enabled = on;
  document.querySelectorAll(`[data-t="${kind}"]`).forEach(b => b.setAttribute('aria-pressed', on));
  if (kind === 'video') $('#off-note').hidden = on;
}

/* ---- peers ---------------------------------------------------------- */
function tile(id, srcObject, label, mine) {
  let el = document.getElementById('t-' + id);
  if (!el) {
    el = document.createElement('figure');
    el.id = 't-' + id;
    el.className = 'tile' + (mine ? ' me' : '');
    el.innerHTML = `<video autoplay playsinline ${mine ? 'muted' : ''}></video>
                    <figcaption>${label}</figcaption>`;
    $('#grid').append(el);
  }
  el.querySelector('video').srcObject = srcObject;
  el.querySelector('video').muted = mine || $('#c-spk').getAttribute('aria-pressed') === 'false';
}

function handle(call, id = call.peer) {
  peers.add(id);
  call.on('stream', s => tile(id, s, 'Guest ' + peers.size));
  call.on('close', () => { peers.delete(id); document.getElementById('t-' + id)?.remove() });
  call.on('error', () => peers.delete(id));
}

const connect = id => {
  if (id === peer.id || peers.has(id)) return;
  handle(peer.call(id, stream), id);
};

async function start(id) {
  peer = new Peer(id);
  peer.on('call', c => { c.answer(stream); handle(c) });
  peer.on('error', e => alert(e.type === 'unavailable-id'
    ? 'That code is already in use. Open a new room.'
    : e.type === 'peer-unavailable' ? 'No room with that code.' : e.message));
  return new Promise(res => peer.on('open', res));
}

/* ---- flow ----------------------------------------------------------- */
$('#go-host').onclick = () => openSetup('host');
$('#go-join').onclick = () => openSetup('join');
$('#back').onclick = () => { stream?.getTracks().forEach(t => t.stop()); stream = null; show('lobby') };

async function openSetup(m) {
  mode = m;
  $('#setup-title').textContent = m === 'host' ? 'Check yourself' : 'Code and camera';
  $('#enter').textContent = m === 'host' ? 'Open the room' : 'Join the room';
  $('#code-in').hidden = m === 'host';
  show('setup');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    $('#pv').srcObject = stream;
  } catch {
    alert('No camera or microphone access — the call needs at least one of them.');
    show('lobby');
  }
}

const bindToggle = (btn, kind) => {
  btn.dataset.t = kind;
  btn.onclick = () => setTrack(kind, btn.getAttribute('aria-pressed') === 'false');
};
bindToggle($('#t-mic'), 'audio'); bindToggle($('#t-cam'), 'video');
bindToggle($('#c-mic'), 'audio'); bindToggle($('#c-cam'), 'video');

$('#c-spk').onclick = () => {
  const on = $('#c-spk').getAttribute('aria-pressed') === 'false';
  $('#c-spk').setAttribute('aria-pressed', on);
  document.querySelectorAll('.tile:not(.me) video').forEach(v => v.muted = !on);
};

$('#enter').onclick = async () => {
  if (mode === 'join') {
    code = $('#code-in').value.trim().toUpperCase();
    if (code.length !== 8) return $('#code-in').focus();
    await start(undefined);
    const host = PREFIX + code;
    const conn = peer.connect(host);
    conn.on('open', () => connect(host));
    conn.on('data', ids => ids.forEach(connect));   // mesh up with the other guests
    enterCall();
  } else {
    code = randCode();
    await start(PREFIX + code);
    // A joiner opens a data channel first; we answer with everyone we know, they call each.
    peer.on('connection', c => {
      c.on('open', () => c.send([...peers].filter(p => p !== c.peer)));
      $('#carrier2').classList.add('up');
    });
    url = location.origin + location.pathname + '?c=' + code;
    $('#readout').innerHTML = [...code].map(ch => `<b>${ch}</b>`).join('');
    QRCode.toCanvas($('#qr'), url, { margin: 1, width: 344, color: { dark: '#0A0C10', light: '#F2A65A' } });
    show('share');
  }
};

$('#copy').onclick = async () => {
  await navigator.clipboard.writeText(url);
  $('#copy').textContent = 'Copied';
  setTimeout(() => $('#copy').textContent = 'Copy link', 1500);
};
$('#to-call').onclick = enterCall;

function enterCall() {
  show('call');
  tile('me', stream, 'You', true);
  if (mode === 'host') {
    const b = $('#show-code');
    b.hidden = false; b.textContent = code;
    b.onclick = () => { show('share'); };
  }
}

$('#leave').onclick = () => {
  peer?.destroy(); stream?.getTracks().forEach(t => t.stop());
  location.href = location.pathname;
};

const c = new URLSearchParams(location.search).get('c');
if (c) { $('#code-in').value = c.toUpperCase(); openSetup('join') }
</script>
</html>
