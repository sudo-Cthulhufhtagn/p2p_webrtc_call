<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P2P Call</title>
<style>
  :root { color-scheme: dark }
  body { margin:0; font:16px system-ui; background:#111; color:#eee;
         display:flex; flex-direction:column; height:100dvh }
  #videos { flex:1; display:grid; gap:4px; padding:4px; min-height:0;
            grid-template-columns:repeat(auto-fit,minmax(240px,1fr)) }
  video { width:100%; height:100%; object-fit:cover; background:#000; border-radius:8px; min-height:0 }
  #bar { padding:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center }
  button { font:inherit; padding:10px 16px; border:0; border-radius:8px; background:#2d6; cursor:pointer }
  input { font:inherit; padding:10px; border-radius:8px; border:1px solid #444; background:#222; color:#eee;
          width:11ch; text-transform:uppercase }
  #share { text-align:center; padding:12px }
  #share a { color:#6cf; word-break:break-all }
  code { font-size:1.6em; letter-spacing:.2em }
  .hide { display:none }
</style>

<div id="videos"></div>
<div id="share" class="hide">
  Code: <code id="code"></code><br>
  <canvas id="qr"></canvas><br>
  <a id="link"></a>
</div>
<div id="bar">
  <button id="host">Host session</button>
  <input id="join-code" placeholder="CODE" maxlength="8">
  <button id="join">Join</button>
  <button id="mic" class="hide">Mute</button>
  <button id="cam" class="hide">Camera off</button>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const PREFIX = 'p2pcall-';           // ponytail: public PeerJS server is a shared namespace, prefix avoids id clashes
const peers = new Set();             // remote peer ids we're already connected to
let peer, stream;

const randCode = () =>
  [...crypto.getRandomValues(new Uint8Array(8))]
    .map(n => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[n % 32]).join('');

function addVideo(id, srcObject, muted) {
  let v = document.getElementById('v-' + id);
  if (!v) {
    v = Object.assign(document.createElement('video'),
      { id: 'v-' + id, autoplay: true, playsInline: true, muted: !!muted });
    $('#videos').append(v);
  }
  v.srcObject = srcObject;
}

function connect(remoteId) {
  if (remoteId === peer.id || peers.has(remoteId)) return;
  peers.add(remoteId);
  handle(peer.call(remoteId, stream), remoteId);
}

function handle(call, id = call.peer) {
  peers.add(id);
  call.on('stream', s => addVideo(id, s));
  call.on('close', () => { peers.delete(id); document.getElementById('v-' + id)?.remove(); });
  call.on('error', () => peers.delete(id));
}

async function start(id) {
  stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  addVideo('me', stream, true);
  $('#host').remove(); $('#join').remove(); $('#join-code').remove();
  $('#mic').classList.remove('hide'); $('#cam').classList.remove('hide');

  peer = new Peer(id);
  peer.on('call', c => { c.answer(stream); handle(c); });
  peer.on('error', e => alert(e.type === 'unavailable-id' ? 'Code already in use' : e.message));
  return new Promise(res => peer.on('open', res));
}

$('#host').onclick = async () => {
  const code = randCode();
  await start(PREFIX + code);
  // Roster: a joiner opens a data channel, we reply with everyone we know, then they call each of them.
  peer.on('connection', c => c.on('open', () => c.send([...peers].filter(p => p !== c.peer))));

  const url = location.origin + location.pathname + '?c=' + code;
  $('#code').textContent = code;
  $('#link').textContent = url; $('#link').href = url;
  QRCode.toCanvas($('#qr'), url);
  $('#share').classList.remove('hide');
};

$('#join').onclick = async () => {
  const code = $('#join-code').value.trim().toUpperCase();
  if (code.length !== 8) return alert('Need an 8-character code');
  await start(undefined);
  const hostId = PREFIX + code;
  const conn = peer.connect(hostId);
  conn.on('open', () => connect(hostId));
  conn.on('data', ids => ids.forEach(connect));   // mesh with the other guests
};

const toggle = (kind, btn, on, off) => () => {
  const t = stream.getTracks().find(t => t.kind === kind);
  t.enabled = !t.enabled;
  btn.textContent = t.enabled ? on : off;
};
$('#mic').onclick = toggle('audio', $('#mic'), 'Mute', 'Unmute');
$('#cam').onclick = toggle('video', $('#cam'), 'Camera off', 'Camera on');

const c = new URLSearchParams(location.search).get('c');
if (c) $('#join-code').value = c.toUpperCase();
</script>
